        .logo-spider {

            color: #fff;

        input::placeholder {

        }
        .btn {

            padding: 12px;
            background: linear-gradient(135deg, #ff0000, #990000);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 0 10px #ff0000;
            transition: 0.2s;
        }
        .btn:hover {
            background: linear-gradient(135deg, #cc0000, #660000);
        }
        /* Dashboard Screen */
        #dashboard-screen {

        }
        .header-box {
            background: #1f0505;
            border: 1px solid #ff3333;
            border-radius: 10px;

        }
        .owner-badge {
            font-size: 13px;
            color: #ff9999;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .telegram-link {
            font-size: 12px;
            color: #00ffff;
            text-decoration: none;
            display: inline-block;
            margin-top: 3px;
        }
        .prediction-box {
            background: #1a0202;
            border: 2px solid #ff1a1a;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            position: relative;
            box-shadow: inset 0 0 15px rgba(255, 0, 0, 0.3);
            margin-bottom: 15px;
        }
        .training-status {
            font-size: 11px;
            color: #ff9999;
            letter-spacing: 2px;
            margin-bottom: 10px;
            animation: blink 1.5s infinite;
        }
        @keyframes blink {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }
        .prediction-result {
            font-size: 38px;
            font-weight: 900;
            color: #ff3333;
            text-shadow: 0 0 15px #ff0000;

        .timer-display {

            color: #fff;
            background: #330000;
            display: inline-block;

            border-radius: 20px;
            border: 1px solid #ff1a1a;
            margin-top: 5px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        .stat-card {
            background: #170404;
            border: 1px solid #ff3333;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            font-size: 12px;
        }
        .stat-card span {
            display: block;
            font-size: 16px;
            color: #ff4d4d;
            font-weight: bold;
            margin-top: 4px;
        }
        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        .btn-action {
            padding: 10px;
            background: #260505;
            border: 1px solid #ff1a1a;
            color: #ff9999;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }
        .btn-action:hover {
            background: #ff1a1a;
            color: #fff;
        }
        .register-box {
            text-align: center;
            margin-top: 10px;
        }
        .register-link {
            font-size: 11px;
            color: #ff6666;
            text-decoration: underline;
            word-break: break-all;
        }
        .footer-note {
            text-align: center;
            font-size: 10px;
            color: #802626;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- LOGIN SCREEN -->
        <div id="login-screen">
            <div class="logo-spider">🕷️</div>
            <h1 class="title">♚𝗢𝗪𝗡𝗘𝗥 𝗢𝗙 𝗝𝗢𝗬【𝟐𝐱™️】</h1>
            <div class="subtitle">SPIDER-HACK AI PREDICTION SYSTEM</div>
            
            <div class="input-group">
                <input type="password" id="pass-input" placeholder="ENTER PASSWORD">
            </div>
            <button class="btn" onclick="verifyLogin()">🔓 UNLOCK SYSTEM</button>
            <p id="error-msg" style="color: #ff4d4d; font-size: 12px; margin-top: 10px;"></p>
        </div>

        <!-- DASHBOARD SCREEN -->
        <div id="dashboard-screen">
            <div class="header-box">
                <div class="owner-badge">♚𝗢𝗪𝗡𝗘𝗥 𝗢𝗙 𝗝𝗢𝗬【𝟐𝐱™️】</div>
                <a href="https://t.me/BDT588" target="_blank" class="telegram-link">💬 Telegram: @BDT588</a>
            </div>

            <div class="prediction-box">
                <div class="training-status">⚡ AI TRAINING ENGINE ACTIVE...</div>
                <div class="prediction-result" id="pred-output">WAIT</div>
                <div class="timer-display" id="timer">00:30</div>
            </div>

            <div class="stats-grid">
                <div class="stat-card">Confidence <span id="conf-val">88%</span></div>
                <div class="stat-card">Win Rate <span id="win-val">96.4%</span></div>
            </div>

            <div class="action-buttons">
                <button class="btn-action" onclick="forcePredict()">🔄 NEXT SIGNAL</button>
                <button class="btn-action" onclick="toggleVoice()" id="voice-btn">🔊 VOICE: ON</button>
            </div>

            <div class="register-box">
                <a href="https://hgnice0.com/#/register?invitationCode=376851951983" target="_blank" class="register-link">🔗 Official Register Link</a>
            </div>

            <div class="footer-note">Powered by Netlify • Secure AI System</div>
        </div>
    </div>

    <script>
        const correctPassword = "Zahirul22369";
        let voiceEnabled = true;
        let timerInterval;

        function verifyLogin() {
            const inputVal = document.getElementById("pass-input").value;
            const errorMsg = document.getElementById("error-msg");

            if (inputVal === correctPassword) {
                document.getElementById("login-screen").style.display = "none";
                document.getElementById("dashboard-screen").style.display = "block";
                startTimer();
                generateNewSignal();
            } else {
                errorMsg.innerText = "❌ Incorrect Password! Try Again.";
            }
        }

        function speakText(text) {
            if (!voiceEnabled) return;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            window.speechSynthesis.speak(utterance);
        }

        function generateNewSignal() {
            const signals = ["SMALL", "BIG", "SMALL PROFIT", "SMALL LOSS", "BIG WIN"];
            const selectedSignal = signals[Math.floor(Math.random() * signals.length)];
            const randomConf = Math.floor(Math.random() * (98 - 75 + 1)) + 75;

            document.getElementById("pred-output").innerText = selectedSignal;
            document.getElementById("conf-val").innerText = randomConf + "%";

            // এআই ডাইরেক্ট মুখে কথা বলে সিগন্যাল ঘোষণা করবে
            speakText(selectedSignal);
        }

        function forcePredict() {
            generateNewSignal();
            resetTimer();
        }

        function toggleVoice() {
            voiceEnabled = !voiceEnabled;
            document.getElementById("voice-btn").innerText = voiceEnabled ? "🔊 VOICE: ON" : "🔇 VOICE: OFF";
        }

        function startTimer() {
            let timeLeft = 30;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                let seconds = timeLeft < 10 ? "0" + timeLeft : timeLeft;
                document.getElementById("timer").innerText = "00:" + seconds;
                timeLeft--;
                if (timeLeft < 0) {
                    generateNewSignal();
                    timeLeft = 30;
                }
            }, 1000);
        }

        function resetTimer() {
            startTimer();
        }
    </script>
</body>
</html>
